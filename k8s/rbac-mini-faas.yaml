# Same guardrail as rbac.yaml, retargeted at mini-faas's real namespace (default)
# instead of the synthetic agent-lab namespace. No new Namespace object needed —
# "default" already exists in every cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-read-only
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["faas.jashitha.dev"]
    resources: ["functions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: agent-reader
    namespace: default
roleRef:
  kind: Role
  name: agent-read-only
  apiGroup: rbac.authorization.k8s.io
