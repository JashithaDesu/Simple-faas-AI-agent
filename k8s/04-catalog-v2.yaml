# Fault: v2 starts fine (no crash) but serves nothing at /, so the readiness
# probe fails. With maxUnavailable=0 the old v1 pods keep serving and the
# rollout gets stuck. Correct fix: roll back to the previous revision.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: agent-lab
  labels:
    app: catalog
  annotations:
    kubernetes.io/change-cause: "v2: switch to lightweight busybox web server"
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && exec httpd -f -p 80 -h /www"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
