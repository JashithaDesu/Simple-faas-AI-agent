# Healthy baseline version. Applied and fully rolled out before v2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: agent-lab
  labels:
    app: catalog
  annotations:
    kubernetes.io/change-cause: "v1: nginx web server"
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 2
